name: Automated testing

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

env:
  APP_NAME: node_project

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      job_name: install
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: install node modules
        run: npm ci
      - name: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules/

  test:
    runs-on: ubuntu-latest
    needs: install
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules/

      - name: rebuild binaries
        run: npm rebuild

      - name: run test
        run: echo "secret is $SECRET" && npm test
        env:
          SECRET: ${{ secrets.MY_SECRET }}
