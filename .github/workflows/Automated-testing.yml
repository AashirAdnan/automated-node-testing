name: Automated testing

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

env:
  APP_NAME: node_project

jobs:
  install:
    strategy:
      matrix:
        node-version: [20, 22, 24]
    env:
      job_name: install
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        env:
          step_name: checkout

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: ${{matrix.node-version}}
          cache: "npm"

      - name: install node modules
        run: npm ci

      - name: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules/

  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules/

      - name: run test
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: building app
        run: echo "the app is building $SECRET!!!"
    env:
      SECRET: ${{secrets.MY_SECRET}}
